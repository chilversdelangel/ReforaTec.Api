name: CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Test, Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ReforaTec.slnx

      - name: Build solution
        run: dotnet build ReforaTec.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ReforaTec.slnx --no-build --configuration Release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chilversdelangel/reforatec:latest
            ghcr.io/chilversdelangel/reforatec:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: [ self-hosted, Linux, X64, production ]
    timeout-minutes: 5

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart ReforaTec API
        run: |
          docker compose -f "$HOME/reforatec/docker-compose.prod.yml" pull reforatec-api
          docker compose -f "$HOME/reforatec/docker-compose.prod.yml" up -d reforatec-api
          docker image prune -f

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ReforaTec.slnx

      - name: Build solution (Release)
        run: dotnet build ReforaTec.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ReforaTec.slnx --no-build --configuration Release

      - name: Verify Docker build
        run: docker build -t reforatec-api:ci .
